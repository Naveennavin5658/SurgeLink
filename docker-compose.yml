services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  capacity-api:
    build: ./services/capacity-api
    ports:
      - "5001:5001"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/surgelink
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: surgelink-dev-secret-change-in-prod
      FLASK_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/capacity-api:/app
    command: bash entrypoint.sh

  transfer-coordinator:
    build: ./services/transfer-coordinator
    ports:
      - "5002:5002"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/surgelink
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: surgelink-dev-secret-change-in-prod
      CAPACITY_API_URL: http://capacity-api:5001
      FLASK_ENV: development
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      capacity-api:
        condition: service_started
    volumes:
      - ./services/transfer-coordinator:/app
    command: python -m flask run --host=0.0.0.0 --port=5002

  notification-worker:
    build: ./services/notification-worker
    environment:
      MONGODB_URI: mongodb://mongodb:27017/surgelink
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/notification-worker:/app
    command: celery -A worker.celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_CAPACITY_API_URL: http://localhost:5001
      VITE_TRANSFER_API_URL: http://localhost:5002
    depends_on:
      - capacity-api
      - transfer-coordinator
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  mongodb_data:
